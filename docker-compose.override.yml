# Только для локальной разработки: docker compose подхватывает этот файл сам.
# Без него (docker compose -f docker-compose.yml up) S3 не поднимается,
# и его адрес и ключи нужно задать в .env через AWS_*.
services:
  api:
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-devkey}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-devsecret}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-http://s3:8333}
      - S3_AVATARS_BUCKET=${S3_AVATARS_BUCKET:-cellestial-avatars-local}
      - S3_PRIVATE_FILES_BUCKET=${S3_PRIVATE_FILES_BUCKET:-cellestial-private-files-local}
      - S3_AVATARS_PUBLIC_URL=${S3_AVATARS_PUBLIC_URL:-http://localhost:${S3_PORT:-8333}/${S3_AVATARS_BUCKET:-cellestial-avatars-local}}
    depends_on:
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -bucket=${S3_AVATARS_BUCKET:-cellestial-avatars-local},${S3_PRIVATE_FILES_BUCKET:-cellestial-private-files-local}
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-devkey}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-devsecret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Локальное анонимное чтение ограничено бакетом аватаров.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET:-cellestial-avatars-local}
      S3_PRIVATE_FILES_BUCKET: ${S3_PRIVATE_FILES_BUCKET:-cellestial-private-files-local}
    command:
      - |
        if [ "$$S3_AVATARS_BUCKET" = "$$S3_PRIVATE_FILES_BUCKET" ]; then
          echo 'S3_AVATARS_BUCKET and S3_PRIVATE_FILES_BUCKET must differ' >&2
          exit 1
        fi
        for bucket in "$$S3_AVATARS_BUCKET" "$$S3_PRIVATE_FILES_BUCKET"; do
          case "$$bucket" in
            *[!a-z0-9.-]*) echo 'Invalid local S3 bucket name' >&2; exit 1 ;;
          esac
        done
        {
          printf 's3.bucket.access -name %s -user anonymous -access none\n' "$$S3_PRIVATE_FILES_BUCKET"
          printf 's3.bucket.access -name %s -user anonymous -access Read\n' "$$S3_AVATARS_BUCKET"
        } | weed shell -master=s3:9333 -filer=s3:8888
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

volumes:
  s3_data:
