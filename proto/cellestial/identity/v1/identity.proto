syntax = "proto3";

package cellestial.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_Cringe_Driven_Development/gen/cellestial/identity/v1;identityv1";

// Session проверяет пользовательскую сессию для доверенного Workspace.
service Session {
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
}

// ValidateSessionRequest передаётся только по mTLS и никогда не логируется целиком.
message ValidateSessionRequest {
  string access_token = 1;
}

// ValidateSessionResponse содержит только подтверждённую идентичность и срок токена.
message ValidateSessionResponse {
  int64 user_id = 1;
  string session_id = 2;
  uint64 session_version = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Users доступен только Workspace; отсутствие пользователя не маскируется пустым DTO.
service Users {
  rpc BatchGetUsers(BatchGetUsersRequest) returns (UsersResponse);
  rpc BatchResolveUsers(BatchResolveUsersRequest) returns (UsersResponse);
}
message BatchGetUsersRequest {
  // От 1 до 100 положительных ID; дубликаты не дублируют результат.
  repeated int64 user_ids = 1;
}
message BatchResolveUsersRequest {
  // От 1 до 100 логинов, сравнение без учёта регистра.
  repeated string logins = 1;
}
message User {
  int64 id = 1;
  string login = 2;
  // Публичный URL аватара, пустой при отсутствии аватара.
  string avatar_url = 3;
}
message UsersResponse {
  // Уникальные найденные пользователи в порядке ID. Отсутствующие ссылки пропускаются.
  repeated User users = 1;
  // Результат каждого входного селектора, включая явное not_found.
  repeated UserResolution results = 2;
}

// UserAdministration разрешён только отдельному identity-admin principal.
service UserAdministration {
  rpc RequestUserDeletion(RequestUserDeletionRequest) returns (UserDeletion);
  rpc GetUserDeletion(GetUserDeletionRequest) returns (UserDeletion);
}
message RequestUserDeletionRequest { int64 user_id = 1; string operation_id = 2; }
message GetUserDeletionRequest { string operation_id = 1; }
message UserDeletion {
  string operation_id = 1;
  int64 user_id = 2;
  string stage = 3;
  bool done = 4;
  string error_code = 5;
}
message UserResolution {
  int64 requested_id = 1;
  string requested_login = 2;
  oneof outcome { User user = 3; bool not_found = 4; }
}

// OnlineConfAccess проверяет роль пользователя для доверенного OnlineConf.
service OnlineConfAccess {
  rpc Authorize(ValidateSessionRequest) returns (OnlineConfAuthorization);
}

message OnlineConfAuthorization {
  // Идентификатор пользователя из проверенной сессии.
  int64 user_id = 1;
}
