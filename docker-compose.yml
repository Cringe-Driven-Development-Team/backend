services:
  api:
    build:
      context: .
      dockerfile: build/main.Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WRITE_TIMEOUT=${WRITE_TIMEOUT:-15s}
      - READ_TIMEOUT=${READ_TIMEOUT:-15s}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - JWT_SECRET=${JWT_SECRET}
      - API_AUTH_MODE=${API_AUTH_MODE:-legacy}
      - BFF_S2S_REQUIRED=${BFF_S2S_REQUIRED:-false}
      - BFF_API_KEY=${BFF_API_KEY:-}
      - BFF_API_KEY_PREVIOUS=${BFF_API_KEY_PREVIOUS:-}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-720h}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Локальные значения и сам S3 — в docker-compose.override.yml.
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-}
      - S3_NOTEBOOKS_BUCKET=${S3_NOTEBOOKS_BUCKET:-}
      - APP_ORIGIN=${APP_ORIGIN-https://cellestial.ru}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS-https://cellestial.ru,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT:-8080}/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
