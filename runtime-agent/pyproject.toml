[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellestial-agent"
version = "0.1.0"
description = "Private API for isolated Python and R notebook sessions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "aiohttp==3.14.5",
  "docker==7.2.0",
]

[project.scripts]
cellestial-runtime-agent = "runtime_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["docker: requires Docker and both kernel images", "jupyter: requires a local Jupyter Server", "network: requires disposable VPS with infra firewall"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
