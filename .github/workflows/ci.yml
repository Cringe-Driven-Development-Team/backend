name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check dependencies
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        run: make test

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Export deployment tag
        id: tag
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          tag=$(jq -r '.tags[] | split(":")[-1] | select(startswith("sha-"))' <<< "$IMAGE_METADATA")
          [[ "$tag" =~ ^sha-[0-9a-f]{7,40}$ ]]
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/main.Dockerfile
          push: ${{ github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify private package
        if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          metadata=$(gh api orgs/Cringe-Driven-Development-Team/packages/container/backend)
          jq -e --arg repository "$EXPECTED_REPOSITORY" \
            '.visibility == "private" and .repository.full_name == $repository' <<< "$metadata" > /dev/null
          jq '{visibility, repository: .repository.full_name}' <<< "$metadata"

  deploy:
    name: deploy
    needs: docker
    if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd.yml
    with:
      backend_image_tag: ${{ needs.docker.outputs.image_tag }}
    secrets: inherit

  course-sync:
    needs: [lint, test, docker]
    if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COURSE_SYNC_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    uses: Cringe-Driven-Development-Team/.github/.github/workflows/sync-to-course.yml@e7eb79fab5f888238ffd570e12912c4ae4ab9559
    with:
      sha: ${{ github.sha }}
      ci_run_id: ${{ format('{0}', github.run_id) }}
      automation_ref: e7eb79fab5f888238ffd570e12912c4ae4ab9559
    secrets:
      COURSE_SYNC_SSH_KEY: ${{ secrets.COURSE_SYNC_SSH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
