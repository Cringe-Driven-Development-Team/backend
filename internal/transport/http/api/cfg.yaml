package: api
output: api.gen.go
generate:
  gorilla-server: true
  strict-server: true
  models: true
  embedded-spec: true
# Generate only the implemented API-41 operations. API-14 extends this list
# together with its notebook editing handlers and tests.
output-options:
  include-operation-ids:
    - registerUser
    - loginUser
    - refreshToken
    - logoutUser
    - getCurrentUser
    - listNotebooks
    - createNotebook
    - getNotebook
    - createCell
    - deleteCell
